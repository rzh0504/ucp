name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            artifact_name: ucp-windows
            package_type: wxsmsi
          - name: macOS
            os: macos-latest
            artifact_name: ucp-macos
            package_type: dmg
          - name: Linux
            os: ubuntu-24.04
            artifact_name: ucp-linux
            package_type: deb

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libwayland-dev \
            libfontconfig1-dev \
            libasound2-dev \
            patchelf

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --version 0.11.0 --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Build installer
        if: runner.os != 'Windows'
        run: cargo bundle --release --format ${{ matrix.package_type }}

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # cargo-bundle 0.11.0 generates a 32-bit Program Files directory for
          # the 64-bit executable. Let it generate the project, then fix ICE80.
          cargo bundle --release --format wxsmsi
          $bundleExitCode = $LASTEXITCODE
          if ($bundleExitCode -ne 0) {
            Write-Host "cargo-bundle exited with $bundleExitCode after generating the WiX project; continuing with the patched project."
          }

          $wxsPath = "target/release/bundle/wxsmsi/installer.wxs"
          if (-not (Test-Path -LiteralPath $wxsPath)) {
            throw "cargo-bundle did not generate $wxsPath"
          }

          $wxs = [System.IO.File]::ReadAllText($wxsPath)
          $patchedWxs = $wxs.Replace(
            'Id="ProgramFilesFolder"',
            'Id="ProgramFiles64Folder"'
          ).Replace(
            'Id="MainExecutableComponent" Guid="*"',
            'Id="MainExecutableComponent" Guid="*" Bitness="always64"'
          )
          if ($patchedWxs -eq $wxs) {
            throw "The 64-bit WiX substitutions were not applied to $wxsPath"
          }
          if (
            -not $patchedWxs.Contains('Id="ProgramFiles64Folder"') -or
            -not $patchedWxs.Contains('Id="MainExecutableComponent" Guid="*" Bitness="always64"')
          ) {
            throw "The generated WiX project did not match the expected structure"
          }
          [System.IO.File]::WriteAllText($wxsPath, $patchedWxs)

          dotnet build target/release/bundle/wxsmsi/installer.wixproj -c Release -p:Platform=x64
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Collect installer artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactName = "${{ matrix.artifact_name }}"
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $roots = @("target/release/bundle")
          $installerExtensions = @(".msi", ".dmg", ".pkg", ".AppImage", ".deb", ".rpm")
          $allFiles = @()

          foreach ($root in $roots) {
            if (Test-Path -LiteralPath $root) {
              $allFiles += Get-ChildItem -LiteralPath $root -Recurse -File
            }
          }

          $files = $allFiles | Where-Object {
            if ($installerExtensions -contains $_.Extension) {
              $true
            } elseif ($_.Extension -ieq ".exe") {
              $_.BaseName -match "(?i)(setup|installer|install)"
            } else {
              $false
            }
          }

          $files = $files | Sort-Object -Property FullName -Unique
          if (-not $files) {
            if (Test-Path -LiteralPath "target") {
              Get-ChildItem -LiteralPath "target" -Recurse -File | Select-Object FullName, Length
            }
            throw "No installer artifacts were produced."
          }

          foreach ($file in $files) {
            $destination = Join-Path "release-assets" "$artifactName$($file.Extension)"
            Copy-Item -LiteralPath $file.FullName -Destination $destination -Force
          }

          Get-ChildItem -LiteralPath release-assets -File | Select-Object Name, Length

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          current_sha="$(git rev-list -n 1 "$tag_name")"
          previous_tag="$(git describe --tags --match 'v*' --abbrev=0 "${current_sha}^" 2>/dev/null || true)"

          {
            echo "## Changes"
            echo
            if [ -n "$previous_tag" ]; then
              echo "Commits since \`$previous_tag\`:"
              echo
              git log "${previous_tag}..${current_sha}" --pretty=format:'- %s (%h)'
            else
              echo "Commits included in \`$tag_name\`:"
              echo
              git log "$current_sha" --pretty=format:'- %s (%h)'
            fi
            echo
            echo
            echo "## Installers"
            echo
            echo "Download the installer for your platform from the release assets below."
          } > release-notes.md

          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/*
