[package]
name = "ucp"
version = "0.3.5"
edition = "2024"
description = "A desktop clipboard history app built with GPUI."
license-file = "LICENSE"

[dependencies]
arboard = "3"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui = { package = "gpui-pre", version = "0.3" }
gpui_platform = { package = "gpui-pre-platform", version = "0.3", features = ["font-kit", "x11", "wayland"] }
gpui-component = "0.6"
gpui-kit-assets = "0.6"
smol = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "0.3", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["monitor"] }
raw-window-handle = "0.6"
tray-icon = { version = "0.24", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.bundle]
name = "UCP"
identifier = "dev.ucp.clipboard"
publisher = "UCP"
icon = ["assets/icons/app.ico", "assets/icons/app.icns", "assets/icons/Ucp.png"]
category = "Utility"
short_description = "Desktop clipboard history manager"
long_description = "A cross-platform desktop clipboard history manager built with GPUI."
