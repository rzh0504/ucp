[package]
name = "ucp"
version = "0.3.1"
edition = "2024"
description = "A desktop clipboard history app built with GPUI."
license-file = "LICENSE"

[dependencies]
arboard = "3"
async-channel = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
smol = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5", features = ["monitor"] }
raw-window-handle = "0.6"
tray-icon = { version = "0.24", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = "thin"

[package.metadata.bundle]
name = "UCP"
identifier = "dev.ucp.clipboard"
publisher = "UCP"
icon = ["assets/icons/app.ico", "assets/icons/app.icns", "assets/icons/Ucp.png"]
category = "Utility"
short_description = "Desktop clipboard history manager"
long_description = "A cross-platform desktop clipboard history manager built with GPUI."
